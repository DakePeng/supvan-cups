[package]
name = "supvan-discover"
version.workspace = true
edition.workspace = true

[dependencies]
supvan-proto = { workspace = true }
log = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { workspace = true, features = ["time", "rt", "macros"] }

# BlueZ over D-Bus for Classic-Bluetooth discovery, and bluer for the optional
# BLE scan. Linux-only: elsewhere Bluetooth printers are found through the
# serial port the OS creates for a paired SPP device (see `bt_serial.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
bluer = { version = "0.17", optional = true, features = ["bluetoothd"] }
futures-util = { version = "0.3", optional = true }

[features]
default = []
ble = ["dep:bluer", "dep:futures-util", "supvan-proto/ble"]
